name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  EPUBCHECK_VERSION: 5.2.1

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v6
        with:
          path: .tools/epubcheck
          key: epubcheck-${{ env.EPUBCHECK_VERSION }}
      - name: Install pinned epubcheck
        shell: bash
        run: |
          # The jar's manifest declares Class-Path entries like lib/galimatias-*.jar,
          # resolved next to the jar, so the whole distribution has to be installed.
          # `lib` is part of the guard as well: a cache entry from the jar-only
          # install would otherwise be restored and reused forever.
          if [[ ! -f ".tools/epubcheck/epubcheck-${EPUBCHECK_VERSION}.jar" \
                || ! -d ".tools/epubcheck/lib" ]]; then
            rm -rf .tools/epubcheck /tmp/epubcheck
            mkdir -p .tools/epubcheck /tmp/epubcheck
            curl --fail --silent --show-error --location \
              "https://github.com/w3c/epubcheck/releases/download/v${EPUBCHECK_VERSION}/epubcheck-${EPUBCHECK_VERSION}.zip" \
              --output /tmp/epubcheck.zip
            unzip -q /tmp/epubcheck.zip -d /tmp/epubcheck
            dist="$(dirname "$(find /tmp/epubcheck -name epubcheck.jar -print -quit)")"
            cp -R "$dist"/. .tools/epubcheck/
            mv ".tools/epubcheck/epubcheck.jar" \
              ".tools/epubcheck/epubcheck-${EPUBCHECK_VERSION}.jar"
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm build:fixture-epubs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  azw3-interoperability:
    runs-on: ubuntu-latest
    env:
      CALIBRE_DIR: .tools/calibre
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: .tools/calibre
          key: calibre-9.15.0-linux-x86_64
      - name: Install Calibre system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libfontconfig1 libgl1 libnss3 libopengl0 libsm6 \
            libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 \
            libxcb-xkb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 \
            libxi6 libxkbcommon-x11-0 libxrandr2 libxrender1
      - name: Install pinned Calibre 9.15.0
        run: |
          if [[ ! -x "$CALIBRE_DIR/ebook-convert" || ! -x "$CALIBRE_DIR/calibre-debug" ]]; then
            rm -rf "$CALIBRE_DIR"
            mkdir -p "$CALIBRE_DIR"
            curl --fail --silent --show-error --location \
              https://download.calibre-ebook.com/9.15.0/calibre-9.15.0-x86_64.txz \
              --output /tmp/calibre-9.15.0-x86_64.txz
            tar -xJf /tmp/calibre-9.15.0-x86_64.txz -C "$CALIBRE_DIR"
            "$CALIBRE_DIR/calibre_postinstall"
          fi
          "$CALIBRE_DIR/ebook-convert" --version
          "$CALIBRE_DIR/calibre-debug" --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:verify-azw3
      - run: pnpm verify:azw3
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: azw3-interoperability-${{ github.run_id }}
          path: .artifacts/azw3-fixtures
          if-no-files-found: warn
          retention-days: 7

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Tauri links against the system GTK/WebKit stack, so without these even
      # `cargo clippy` dies in the glib-sys build script before reaching our
      # crate. Same list the release workflow installs for the Linux bundle.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
