version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # vue-tsc 3.x needs the TypeScript JS API, which TypeScript 7 no longer ships.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
